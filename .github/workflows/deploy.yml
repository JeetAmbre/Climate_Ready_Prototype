name: Auto Deploy to VPS on Push

on:
  push:
    branches:
      - main  # Trigger deployment on push to main branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Auto Deploy on VPS
        env:
          DEPLOY_SECRET: ${{ secrets.DEPLOY_SECRET || 'cr-deploy-78f92a10b4c6e83d91f2' }}
        run: |
          echo "Sending deployment trigger to https://climateready.in/api/deploy-webhook ..."
          response=$(curl -s -w "\n%{http_code}" -X POST https://climateready.in/api/deploy-webhook \
            -H "Authorization: Bearer $DEPLOY_SECRET")
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | head -n -1)
          echo "Response: $body"
          echo "HTTP Status: $http_code"
          if [ "$http_code" -ne 200 ]; then
            echo "Auto-deploy trigger failed with status $http_code"
            exit 1
          fi
          echo "=== AUTO DEPLOY TRIGGERED SUCCESSFULLY ==="

