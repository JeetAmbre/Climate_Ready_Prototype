name: Auto Deploy to VPS on Push

on:
  push:
    branches:
      - main  # Trigger deployment on push to main branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS via Native OpenSSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -p 22 "${USER}@${HOST}" << 'EOF'
            set -e
            cd /var/www/climateready
            git pull origin main
            source venv/bin/activate
            pip install -r requirements.txt
            systemctl restart climateready
            echo "=== AUTO DEPLOY SUCCESSFUL ==="
          EOF
